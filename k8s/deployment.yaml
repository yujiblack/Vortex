apiVersion: apps/v1
kind: Deployment
metadata:
  name: voxdeploy
  namespace: voxdeploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voxdeploy
  template:
    metadata:
      labels:
        app: voxdeploy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: voxdeploy
      containers:
        - name: voxdeploy
          image: docker.io/library/voxdeploy:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: voxdeploy-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
